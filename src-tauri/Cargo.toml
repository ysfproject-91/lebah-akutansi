[package]
name = "bukukas"
version = "1.0.0"
description = "BukuKas - aplikasi pembukuan offline tanpa langganan"
edition = "2021"

[lib]
name = "bukukas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
