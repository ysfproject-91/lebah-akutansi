name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Android NDK & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install JS tooling
        run: npm install

      - name: Run logic tests
        run: node --no-warnings tests/core.test.js

      - name: Generate icons
        run: npx tauri icon app-icon.png

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build release APK
        run: npx tauri android build --apk --target aarch64 --target armv7 --ci

      - name: Sign APK
        run: |
          APK=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -n 1)
          echo "Unsigned APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 "$APK" aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks release.jks --ks-pass pass:bukukas123 --key-pass pass:bukukas123 \
            --out BukuKas.apk aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify BukuKas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BukuKas-apk
          path: BukuKas.apk
